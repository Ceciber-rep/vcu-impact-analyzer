# Evaluation dataset for the LLM impact assessment.
#
# Each scenario = baseline spec + one edit (S1 uses the real revised spec),
# analysed against the ORIGINAL test register (all its messiness kept).
#
# Labels were written by hand from the documents, before any model was run.
# Status codes:
#   D = directly_affected   P = possibly_affected
#   R = needs_human_review  N = not_affected
# Per test:
#   accept    : statuses considered correct (ambiguous cases accept several)
#   preferred : the single best answer (used for the stricter score)
#   critical  : a wrong answer here is a key failure (missed impact or named trap)
#   why       : the reasoning behind the label
#   actions   : (added for prompt v2) constraints on required_actions decided by the
#               LLM: `must` = actions that must be present, `must_not` = forbidden.
#               fix_link is not scored here: the application sets it from the links.
#   related   : (held-out scenarios) constraints on related_requirements:
#               `must` = IDs that must be listed, `must_not` = IDs that must not be.
#   held_out  : (scenario level) written and committed BEFORE any model ran on it; scored and
#               reported separately from the 84 original cells (S1 to S7).
#   accept_from_v2 : statuses also accepted from prompt v2 on. Prompt v2 redefines
#               directly_affected as "verifies the changed behaviour" and moves
#               "re-run vs update text only" into required_actions. Only the two
#               cells where v1 labels and v1 prompt disagreed are adjusted; v1
#               scores are computed without this field.

defaults:
  # Tests that are clearly unrelated to the change unless a scenario overrides them.
  unrelated: {accept: [N], preferred: N}
  # Broken traceability, unrelated content: flagging for review is also acceptable.
  broken_link_unrelated: {accept: [N, R], preferred: N}
  # TV-008: orphaned link (VCU-OLD-88); content unrelated to any current requirement.
  orphan: {accept: [R, N], preferred: R}

scenarios:
  - id: S1
    title: "DR-01 response time tightened 100 -> 80 ms (real revision B)"
    source: revised   # use data/input/VCU_Spec_Revised.docx as-is
    tests:
      TV-001: {accept: [D], preferred: D, critical: true,
               why: "Linked to DR-01; previous 94 ms exceeds the new 80 ms limit; script hard-codes 100 ms.",
               actions: {must: [rerun, update_procedure]}}
      TV-002: {accept: [D, P], preferred: P, critical: true,
               why: "Linked to DR-01 but evidence has no timing, so it cannot show 80 ms compliance. Missing it is a miss.",
               actions: {must: [rerun]}}
      TV-003: {accept: [D, P, R], preferred: D, critical: true,
               why: "No link, but it is a torque transient at 75-95% demand with 92 ms > 80 ms; legacy 95 ms tolerance; notes say high-load links were lost.",
               actions: {must: [rerun]}}
      TV-004: {accept: [N], preferred: N, critical: true,
               why: "TRAP: 88 ms is brake command latency on a different clock (workshop note); BRK-03 did not change.",
               actions: {must_not: [rerun, update_procedure]}}
      TV-005: unrelated
      TV-006: unrelated
      TV-007: {accept: [P, R], preferred: R, critical: true,
               why: "TBD link, NOT RUN, torque delivery at 80% pedal (> 70% DR-01 trigger). TRAP: 80% pedal is not 80 ms."}
      TV-008: orphan
      TV-009: {accept: [P, N], preferred: P,
               why: "Accelerator response in Sport/Comfort ramp; no quantitative response-time assertion."}
      TV-010: unrelated
      TV-011: unrelated
      TV-012: {accept: [N, R], preferred: N, critical: true,
               why: "TRAP: a timing test with a ms value, but platform start-up only; unrelated to torque response.",
               actions: {must_not: [rerun, update_procedure]}}

  - id: S2
    title: "BRK-03 gains a brake command latency limit of 80 ms"
    edits:
      - {op: replace, req: VCU-BRK-03,
         old: "regardless of pedal position or requested driving mode.",
         new: "regardless of pedal position or requested driving mode. The brake command shall be issued within 80 milliseconds of the emergency brake input."}
    tests:
      TV-001: {accept: [N], preferred: N, critical: true,
               why: "REVERSE TRAP: 94 ms is torque latency, different clock from brake latency; DR-01 unchanged.",
               actions: {must_not: [rerun, update_procedure]}}
      TV-002: {accept: [D, P], preferred: P, critical: true,
               why: "Linked to BRK-03, brake/pedal arbitration; old evidence reports no timing.",
               actions: {must: [rerun]}}
      TV-003: broken_link_unrelated
      TV-004: {accept: [D], preferred: D, critical: true,
               why: "Brake command latency 88 ms > new 80 ms; procedure target 100 ms must be updated.",
               actions: {must: [rerun, update_procedure]}}
      TV-005: unrelated
      TV-006: unrelated
      TV-007: broken_link_unrelated
      TV-008: orphan
      TV-009: unrelated
      TV-010: unrelated
      TV-011: {accept: [D, P], preferred: P, critical: true,
               why: "Linked to BRK-03 (torque cancellation on braking); no timing in evidence.",
               actions: {must: [rerun]}}
      TV-012: broken_link_unrelated

  - id: S3
    title: "DR-02 spike filter threshold 10 -> 5 ms"
    edits:
      - {op: replace, req: VCU-DR-02, old: "shorter than 10 milliseconds", new: "shorter than 5 milliseconds"}
    tests:
      TV-001: {accept: [N, P], preferred: N,
               why: "Step response, not a spike; pedal validation is upstream of DR-01 timing but the test is not about filtering."}
      TV-002: unrelated
      TV-003: broken_link_unrelated
      TV-004: unrelated
      TV-005: unrelated
      TV-006: unrelated
      TV-007: broken_link_unrelated
      TV-008: orphan
      TV-009: unrelated
      TV-010: {accept: [D, P], preferred: D, critical: true,
               why: "A 7 ms pulse is no longer shorter than the filter limit, so the expected 'no propagated torque request' outcome is no longer guaranteed by DR-02.",
               actions: {must: [update_procedure]}}
      TV-011: unrelated
      TV-012: broken_link_unrelated

  - id: S4
    title: "DR-01 response time relaxed 100 -> 120 ms"
    edits:
      - {op: replace, req: VCU-DR-01, old: "within 100 milliseconds", new: "within 120 milliseconds"}
    tests:
      TV-001: {accept: [P, N], preferred: P, critical: true,
               why: "94 ms still meets 120 ms; the 100 ms in script/procedure is stricter, so only an alignment update. Directly affected is over-flagging.",
               actions: {must: [update_procedure], must_not: [rerun]}, accept_from_v2: [D]}
      TV-002: {accept: [N, P], preferred: N}
      TV-003: {accept: [N, P, R], preferred: N,
               why: "92 ms and the 95 ms legacy tolerance are within 120 ms; link still missing.",
               actions: {must_not: [rerun]}}
      TV-004: {accept: [N], preferred: N, critical: true, why: "Brake clock trap, unchanged requirement.",
               actions: {must_not: [rerun, update_procedure]}}
      TV-005: unrelated
      TV-006: unrelated
      TV-007: {accept: [R, P, N], preferred: R}
      TV-008: orphan
      TV-009: {accept: [N, P], preferred: N}
      TV-010: unrelated
      TV-011: unrelated
      TV-012: broken_link_unrelated

  - id: S5
    title: "DGN-04 reworded, same meaning"
    edits:
      - {op: set, req: VCU-DGN-04,
         text: "When the wheel-speed signal is lost, the controller shall switch to a degraded operating mode and record a diagnostic event."}
    tests:
      TV-001: unrelated
      TV-002: unrelated
      TV-003: broken_link_unrelated
      TV-004: unrelated
      TV-005: {accept: [N, P], preferred: N, critical: true,
               why: "Editorial rewording; behaviour and test procedure unchanged. Directly affected is over-flagging.",
               actions: {must_not: [rerun, update_procedure]}}
      TV-006: unrelated
      TV-007: broken_link_unrelated
      TV-008: orphan
      TV-009: unrelated
      TV-010: unrelated
      TV-011: unrelated
      TV-012: broken_link_unrelated

  - id: S6
    title: "MOD-06 operating mode requirement removed"
    edits:
      - {op: remove, req: VCU-MOD-06}
    tests:
      TV-001: unrelated
      TV-002: unrelated
      TV-003: broken_link_unrelated
      TV-004: unrelated
      TV-005: unrelated
      TV-006: {accept: [P, N], preferred: P,
               why: "Uses a Comfort -> Sport mode change as stimulus; modes are no longer specified."}
      TV-007: broken_link_unrelated
      TV-008: orphan
      TV-009: {accept: [R, P, D], preferred: R, critical: true,
               why: "Its only link now points to a removed requirement: retire or re-link.",
               actions: {must_not: [rerun]}}
      TV-010: unrelated
      TV-011: unrelated
      TV-012: broken_link_unrelated

  - id: S7
    title: "New requirement VCU-THM-07 thermal torque derating"
    edits:
      - {op: add, after: VCU-MOD-06, req: VCU-THM-07, title: "Thermal torque derating",
         text: "Under elevated thermal load, the controller shall limit positive propulsion torque to the derated envelope and log a derating diagnostic event."}
    tests:
      TV-001: unrelated
      TV-002: unrelated
      TV-003: {accept: [P, N, R], preferred: P,
               why: "High-load torque transient; high load is not necessarily thermal load."}
      TV-004: unrelated
      TV-005: unrelated
      TV-006: unrelated
      TV-007: {accept: [P, R], preferred: P, critical: true,
               why: "'Acceleration at thermal load', TBD link, NOT RUN: the natural candidate to verify the new requirement.",
               actions: {must: [update_procedure]}, accept_from_v2: [D]}
      TV-008: orphan
      TV-009: unrelated
      TV-010: unrelated
      TV-011: unrelated
      TV-012: broken_link_unrelated

  # ---------------------------------------------------------------------------
  # Held-out scenarios S8 to S10: labels written from the documents before any model saw them.
  # ---------------------------------------------------------------------------

  - id: S8
    held_out: true
    title: "DR-01 trigger raised from 70% to 90% pedal demand (time limit unchanged)"
    edits:
      - {op: replace, req: VCU-DR-01, old: "rises above 70%", new: "rises above 90%"}
    tests:
      TV-001: {accept: [D, P], preferred: D, critical: true,
               actions: {must: [update_procedure]}, related: {must: [VCU-DR-01]},
               why: "Steps demand to 75%, which is below the new 90% trigger: the test no longer exercises the response-time requirement, and its old 94 ms at 75% says nothing about demands above 90%. The stimulus must change. N would be a missed impact."}
      TV-002: {accept: [N, P], preferred: N, critical: true,
               why: "Applies 85% pedal, now below the 90% trigger, and checks brake priority without any timing assertion (comment: timing not reported). The DR-01 time limit did not change, so nothing in its evidence breaks; at most the DR-01 link is now stale. D would be an over-flag."}
      TV-003: {accept: [P, N, R], preferred: P,
               why: "Sweeps 75-95% with a recorded maximum of 92 ms, no link. Only the part above 90% is still in scope, and 92 ms still meets the unchanged 100 ms limit, so the evidence holds; partial overlap makes P the best answer. Accepting N and R because the link is missing and the evidence is intact."}
      TV-004: {accept: [N], preferred: N,
               why: "Brake command latency 88 ms under BRK-03, on a different clock; BRK-03 and the time limit did not change, and its 88 ms must not be compared with the new 90% trigger."}
      TV-005: {accept: [N], preferred: N, why: "Wheel-speed sensor degradation under DGN-04, unrelated to pedal demand."}
      TV-006: {accept: [N], preferred: N, why: "Mode-change audit trail under LOG-05, unrelated to pedal demand."}
      TV-007: {accept: [R, P, N], preferred: R,
               why: "TBD link and NOT RUN; 80% pedal at elevated load is below the new 90% trigger and its intent is unclear. 80% is a pedal level, not a time. R is the safest; P and N are defensible."}
      TV-008: {accept: [R, N], preferred: R, why: "Orphaned link VCU-OLD-88 and a legacy diagnostic replay; unrelated to the trigger change, but its traceability is broken."}
      TV-009: {accept: [N, P], preferred: N,
               why: "Sport versus Comfort ramp under MOD-06 with no quantitative assertion; the trigger change does not touch the ramp profile."}
      TV-010: {accept: [N], preferred: N, why: "7 ms pedal spike filtering under DR-02, unchanged."}
      TV-011: {accept: [N], preferred: N, why: "Torque cancellation on emergency braking under BRK-03, unchanged; 'demand is high' is not tied to the DR-01 trigger."}
      TV-012: {accept: [N, R], preferred: N, why: "ECU wake-up within 500 ms (433 ms recorded), platform start-up only; no link, unrelated to pedal demand."}

  - id: S9
    held_out: true
    title: "Real revision (DR-01 100 -> 80 ms) plus an 80 ms brake command limit on BRK-03"
    base: revised
    edits:
      - {op: replace, req: VCU-BRK-03,
         old: "regardless of pedal position or requested driving mode.",
         new: "regardless of pedal position or requested driving mode. The brake command shall be issued within 80 milliseconds of the emergency brake input."}
    tests:
      TV-001: {accept: [D], preferred: D, critical: true,
               actions: {must: [rerun, update_procedure]}, related: {must: [VCU-DR-01], must_not: [VCU-BRK-03]},
               why: "Torque response 94 ms against the new 80 ms DR-01 limit; script still at 100 ms. It is a torque measurement, so it is tied to DR-01 and not to BRK-03."}
      TV-002: {accept: [D, P], preferred: P, critical: true,
               actions: {must: [rerun]}, related: {must: [VCU-DR-01, VCU-BRK-03]},
               why: "Linked to both changed requirements and its old evidence reports no timing for either, so it cannot show 80 ms compliance on either clock."}
      TV-003: {accept: [D, P, R], preferred: D, critical: true,
               related: {must: [VCU-DR-01], must_not: [VCU-BRK-03]},
               why: "No link, but a 75-95% torque transient with a recorded maximum of 92 ms, above the new 80 ms torque limit; the lost-link note in the workshop sheet points at it. It is torque timing, not brake timing."}
      TV-004: {accept: [D], preferred: D, critical: true,
               actions: {must: [rerun, update_procedure]}, related: {must: [VCU-BRK-03], must_not: [VCU-DR-01]},
               why: "Brake command latency 88 ms is above the new 80 ms brake limit and its 100 ms target must change. It is on the brake clock, so it must not be tied to the torque requirement DR-01."}
      TV-005: {accept: [N], preferred: N, why: "Wheel-speed sensor degradation under DGN-04, unchanged."}
      TV-006: {accept: [N], preferred: N, why: "Mode-change audit trail under LOG-05, unchanged."}
      TV-007: {accept: [P, R], preferred: R, critical: true,
               why: "TBD link, NOT RUN, torque delivery at 80% pedal and elevated load (above the 70% trigger). With two 80 ms limits in play, 80% pedal is a trap: it is a pedal level, not a time."}
      TV-008: {accept: [R, N], preferred: R, why: "Orphaned link VCU-OLD-88 and a legacy diagnostic replay; unrelated to both changes."}
      TV-009: {accept: [P, N], preferred: P,
               why: "Accelerator response under Sport and Comfort with no quantitative response-time assertion; plausibly touched by the torque-response change but no evidence of a time check."}
      TV-010: {accept: [N], preferred: N, why: "7 ms pedal spike filtering under DR-02, unchanged."}
      TV-011: {accept: [D, P], preferred: P, critical: true,
               related: {must: [VCU-BRK-03], must_not: [VCU-DR-01]},
               why: "Torque cancellation on emergency braking under BRK-03, which now has an 80 ms brake command limit; its evidence has no timing. It exercises the brake requirement, not the DR-01 torque limit."}
      TV-012: {accept: [N, R], preferred: N, critical: true,
               why: "ECU wake-up within 500 ms (433 ms recorded) is platform start-up only. Timing trap: two 80 ms limits are in play, but this test is on neither."}

  - id: S10
    held_out: true
    title: "Real revision; register edited: TV-003 linked to DR-01, new TV-013 below the 70% trigger"
    source: revised
    register_edits:
      - {op: set_link, test: TV-003, value: VCU-DR-01}
      - {op: add_test, test_id: TV-013, name: "Pedal step response, low demand",
         procedure: "Step validated accelerator demand to 60%; record the time to the first commanded torque response and confirm a smooth torque ramp.",
         link: VCU-DR-01, result: "PASS (86 ms)", owner: "M.", last_run: "2026-10-09",
         comment: "Low-demand variant of the step script"}
    tests:
      TV-001: {accept: [D], preferred: D, critical: true, actions: {must: [rerun, update_procedure]},
               why: "Same as in the real revision: 94 ms against the new 80 ms limit, script at 100 ms."}
      TV-002: {accept: [D, P], preferred: P, critical: true,
               why: "Same as in the real revision: linked to DR-01 but its old evidence has no timing."}
      TV-003: {accept: [D, P], preferred: D, critical: true, actions: {must: [rerun, update_procedure]},
               related: {must: [VCU-DR-01]},
               why: "Its link is now a valid VCU-DR-01. A 75-95% torque transient with a recorded maximum of 92 ms is above the new 80 ms limit, and the legacy 95 ms tolerance is also too loose. With the link repaired the answer is firm."}
      TV-004: {accept: [N], preferred: N, critical: true,
               why: "Brake command latency 88 ms on a different clock under BRK-03, which did not change."}
      TV-005: {accept: [N], preferred: N, why: "Wheel-speed sensor degradation under DGN-04, unchanged."}
      TV-006: {accept: [N], preferred: N, why: "Mode-change audit trail under LOG-05, unchanged."}
      TV-007: {accept: [P, R], preferred: R, critical: true,
               why: "Same as in the real revision: TBD link, NOT RUN, 80% pedal is a pedal level and not 80 ms."}
      TV-008: {accept: [R, N], preferred: R, why: "Orphaned link VCU-OLD-88 and a legacy diagnostic replay; unrelated to the change."}
      TV-009: {accept: [P, N], preferred: P,
               why: "Accelerator response under Sport and Comfort with no quantitative assertion, as in the real revision."}
      TV-010: {accept: [N], preferred: N, why: "7 ms pedal spike filtering under DR-02, unchanged."}
      TV-011: {accept: [N], preferred: N, why: "Torque cancellation on emergency braking under BRK-03, unchanged."}
      TV-012: {accept: [N, R], preferred: N, critical: true,
               why: "ECU wake-up within 500 ms (433 ms recorded) is platform start-up only; unrelated to torque response."}
      TV-013: {accept: [N, P], preferred: N, critical: true,
               actions: {must_not: [rerun, update_procedure]},
               why: "Linked to VCU-DR-01 and PASS (86 ms), which is above the new 80 ms, but it steps demand to 60%, below the 70% trigger, so DR-01 does not govern it: its 86 ms is not evidence against the limit. D would be an over-flag from a valid link plus a number; P (check the link) is acceptable."}
