[project]
name = "vcu-impact"
version = "0.1.0"
description = "LLM-assisted change impact analysis for the fictional VCU-42 specification and test register"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
vcu-impact = "vcu_impact.cli:main"

[tool.ruff.lint.per-file-ignores]
# Report-generating analysis scripts build long markdown lines.
"eval/assess_*.py" = ["E501"]
